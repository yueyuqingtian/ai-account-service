server:
  port: ${PORT:8080}

spring:
  application:
    name: gpt-plus-service
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

springdoc:
  swagger-ui:
    path: /swagger-ui.html

gpt-plus:
  security:
    token-secret: ${GPT_PLUS_TOKEN_SECRET:dev-change-me-gpt-plus-service}
    inventory-crypto-key: ${GPT_PLUS_INVENTORY_CRYPTO_KEY:0123456789abcdef}
  order:
    unpaid-timeout-minutes: ${ORDER_UNPAID_TIMEOUT_MINUTES:30}
  upload:
    dir: ${GPT_PLUS_UPLOAD_DIR:uploads}
  cors:
    allowed-origins: ${GPT_PLUS_CORS_ALLOWED_ORIGINS:*}
  bootstrap:
    admin:
      username: ${GPT_PLUS_ADMIN_USERNAME:}
      password: ${GPT_PLUS_ADMIN_PASSWORD:}
  payment:
    mock-enabled: true
    alipay:
      app-id: ${ALIPAY_APP_ID:}
      private-key: ${ALIPAY_PRIVATE_KEY:}
      gateway: ${ALIPAY_GATEWAY:https://openapi.alipay.com/gateway.do}
    wechat:
      mch-id: ${WECHAT_MCH_ID:}
      app-id: ${WECHAT_APP_ID:}
      api-v3-key: ${WECHAT_API_V3_KEY:}
      notify-url: ${WECHAT_NOTIFY_URL:}
